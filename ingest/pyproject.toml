[build-system]
requires = ["setuptools", "setuptools-scm", "pybind11~=2.6.1", "build"]
build-backend = "setuptools.build_meta"

[project]
dependencies = [
  "xarray == 2023.7.0",
  "netCDF4 ~= 1.6.4",
  "numpy ~= 1.25.2",
  "paho-mqtt ~= 2.1.0",
  "jsonschema ~= 4.19.0",
  "pybind11 ~= 2.11.1",
  "protobuf ~= 4.25.3",
  "grpcio ~= 1.62.1",
  "pydantic_geojson",
]
name = "esoh-ingest"
description = "This project is made for parsing and publishing metadata to the E-SOH project."
version = "0.0.2"
requires-python = "~=3.11.0"
classifiers = ["Programming Language :: Python :: 3"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ingest.schemas" = ["ingest/schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = "."


[tool.cibuildwheel]
build-frontend = "build"
build = ["cp310-manylinux_x86_64"]


[tool.cibuildwheel.linux]
before-all = "yum install -y rapidjson-devel"
